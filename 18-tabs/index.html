<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>js-practice</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/main.js" defer></script>
  </head>
  <body>
    <main>
      <section class="p-tabs">
        <!-- タブ -->
        <div class="p-tabs__list" role="tablist" aria-label="サービス情報">
          <button
            class="p-tabs__btn js-tab is-active"
            type="button"
            role="tab"
            id="tab-1"
            aria-controls="panel-1"
            aria-selected="true"
            tabindex="0"
          >
            概要
          </button>
          <button
            class="p-tabs__btn js-tab"
            type="button"
            role="tab"
            id="tab-2"
            aria-controls="panel-2"
            aria-selected="false"
            tabindex="-1"
          >
            料金
          </button>
          <button
            class="p-tabs__btn js-tab"
            type="button"
            role="tab"
            id="tab-3"
            aria-controls="panel-3"
            aria-selected="false"
            tabindex="-1"
          >
            アクセス
          </button>
        </div>
        <!-- パネル -->
        <div class="p-tabs__panels">
          <div
            class="p-tabs__panel js-panel is-active"
            role="tabpanel"
            id="panel-1"
            aria-labelledby="tab-1"
            tabindex="0"
          >
            <h3 class="p-tabs__heading">概要</h3>
            <p>サービスの概要です。</p>
          </div>
          <div
            class="p-tabs__panel js-panel"
            role="tabpanel"
            id="panel-2"
            aria-labelledby="tab-2"
            tabindex="0"
          >
            <h3 class="p-tabs__heading">料金</h3>
            <p>料金プランの説明です。</p>
          </div>
          <div
            class="p-tabs__panel js-panel"
            role="tabpanel"
            id="panel-3"
            aria-labelledby="tab-3"
            tabindex="0"
          >
            <h3 class="p-tabs__heading">アクセス</h3>
            <p>アクセス・地図の情報です。</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
