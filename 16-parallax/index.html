<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>js-practice</title>

    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/main.js" defer></script>
  </head>
  <body>
    <main>
      <div class="spacer"></div>
      <section class="p-fv">
        <img
          class="p-fv__bg js-parallax"
          data-speed="0.3"
          src="https://picsum.photos/seed/para/1920/1200"
          alt=""
          width="1920"
          height="1200"
        />
        <div class="p-fv__overlay"></div>

        <p class="p-fv__back js-parallax" data-speed="0.4">WORKS</p>

        <div class="p-fv__inner js-parallax" data-speed="-0.5">
          <p class="p-fv__lead">Creative Developer</p>
          <h1 class="p-fv__title">Hoko</h1>
        </div>
      </section>
      <div class="spacer"></div>
    </main>
  </body>
</html>
