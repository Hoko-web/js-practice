<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>js-practice</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/main.js" defer></script>
  </head>
  <body>
    <main>
      <section class="p-compare">
        <figure class="p-compare__frame">
          <img
            src="https://picsum.photos/id/1015/1200/800"
            alt="施工後の写真"
            class="p-compare__after"
            width="1200"
            height="800"
            decoding="async"
            fetchpriority="high"
          />
          <img
            src="https://picsum.photos/id/1039/1200/800"
            alt="施工前の写真"
            class="p-compare__before"
            width="1200"
            height="800"
            decoding="async"
          />
          <span class="p-compare__label p-compare__label--before">BEFORE</span>
          <span class="p-compare__label p-compare__label--after">AFTER</span>
          <button
            class="p-compare__handle js-handle"
            type="button"
            role="slider"
            aria-label="スライダーをドラッグして比較"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="50"
          ></button>
        </figure>
      </section>
    </main>
  </body>
</html>
