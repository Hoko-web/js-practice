<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>js-practice</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/main.js" defer></script>
  </head>
  <body>
    <header class="p-header">
      <div class="p-header__inner">
        <a href="#" class="p-header__logo">Hoko</a>
        <nav class="p-header__nav" aria-label="グローバルナビ">
          <ul class="p-header__list">
            <li class="p-header__item">
              <a href="#" class="p-header__link">ホーム</a>
            </li>

            <li class="p-header__item js-dropdown">
              <button
                class="p-header__toggle js-dropdown-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="dropdown-service"
              >
                事業内容
              </button>
              <ul class="p-header__dropdown" id="dropdown-service">
                <li class="p-header__dropdown-item">
                  <a href="#" class="p-header__dropdown-link">Web制作</a>
                </li>
                <li class="p-header__dropdown-item">
                  <a href="#" class="p-header__dropdown-link">保守運用</a>
                </li>
                <li class="p-header__dropdown-item">
                  <a href="#" class="p-header__dropdown-link"
                    >コンサルティング</a
                  >
                </li>
              </ul>
            </li>

            <li class="p-header__item js-dropdown">
              <button
                class="p-header__toggle js-dropdown-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="dropdown-company"
              >
                会社情報
              </button>
              <ul class="p-header__dropdown" id="dropdown-company">
                <li class="p-header__dropdown-item">
                  <a href="#" class="p-header__dropdown-link">会社概要</a>
                </li>
                <li class="p-header__dropdown-item">
                  <a href="#" class="p-header__dropdown-link">代表挨拶</a>
                </li>
                <li class="p-header__dropdown-item">
                  <a href="#" class="p-header__dropdown-link">アクセス</a>
                </li>
              </ul>
            </li>

            <li class="p-header__item">
              <a href="#" class="p-header__link">お問い合わせ</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
