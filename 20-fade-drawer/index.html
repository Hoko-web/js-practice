<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>js-practice</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/main.js" defer></script>
  </head>
  <body>
    <header class="p-header">
      <div class="p-header__inner">
        <a href="#" class="p-header__logo">Hoko</a>
        <button
          class="p-header__hamburger js-hamburger"
          type="button"
          aria-label="メニューを開く"
          aria-controls="drawer"
          aria-expanded="false"
        >
          <span class="p-header__hamburger-line"></span>
          <span class="p-header__hamburger-line"></span>
          <span class="p-header__hamburger-line"></span>
        </button>
      </div>
    </header>
    <div class="p-drawer js-drawer" id="drawer">
      <nav class="p-drawer__nav" aria-label="メインメニュー">
        <ul class="p-drawer__list">
          <li class="p-drawer__item">
            <a href="#Home" class="p-drawer__link">Home</a>
          </li>
          <li class="p-drawer__item">
            <a href="#About" class="p-drawer__link">About</a>
          </li>
          <li class="p-drawer__item">
            <a href="#Works" class="p-drawer__link">Works</a>
          </li>
          <li class="p-drawer__item">
            <a href="#Contact" class="p-drawer__link">Contact</a>
          </li>
        </ul>
      </nav>
    </div>
  </body>
</html>
