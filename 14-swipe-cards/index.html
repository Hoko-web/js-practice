<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>js-practice</title>

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Saira:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- css js -->
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main>
      <section class="p-swipe">
        <div class="p-swipe__cards js-swipe">
          <article class="c-card js-card">
            <div class="c-card__img">
              <img
                src="https://picsum.photos/seed/1/400/560"
                alt=""
                width="400"
                height="560"
                decoding="async"
                fetchpriority="high"
              />
            </div>
            <div class="c-card__body">
              <h2 class="c-card__name">Hiro</h2>
              <p class="c-card__text">Aichi</p>
            </div>
          </article>
          <article class="c-card js-card">
            <div class="c-card__img">
              <img
                src="https://picsum.photos/seed/2/400/560"
                alt=""
                width="400"
                height="560"
                decoding="async"
              />
            </div>
            <div class="c-card__body">
              <h2 class="c-card__name">Aoi</h2>
              <p class="c-card__text">Tokyo</p>
            </div>
          </article>
          <article class="c-card js-card">
            <div class="c-card__img">
              <img
                src="https://picsum.photos/seed/3/400/560"
                alt=""
                width="400"
                height="560"
                decoding="async"
              />
            </div>
            <div class="c-card__body">
              <h2 class="c-card__name">Kazu</h2>
              <p class="c-card__text">Kumamoto</p>
            </div>
          </article>
          <article class="c-card js-card">
            <div class="c-card__img">
              <img
                src="https://picsum.photos/seed/4/400/560"
                alt=""
                width="400"
                height="560"
                decoding="async"
              />
            </div>
            <div class="c-card__body">
              <h2 class="c-card__name">Rino</h2>
              <p class="c-card__text">Kyoto</p>
            </div>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
